[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[context.develop]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# Social-card path standardization (0804): the Wedge + Words cards/thumbs moved
# from the old flat, dimension-named path to /og/watchmans-desk/<slug>{,-thumb}.png.
# Originals are LEFT in place (already-crawled X/Facebook posts keep resolving);
# these are the safety net so a revisiting crawler never 404s if a file is cleaned.
[[redirects]]
  from = "/og/the-wedge-is-quiet-card-1200x630.png"
  to = "/og/watchmans-desk/the-wedge-is-quiet.v2.png"
  status = 301
[[redirects]]
  from = "/og/the-wedge-is-quiet-thumb-1280x720.png"
  to = "/og/watchmans-desk/the-wedge-is-quiet-thumb.png"
  status = 301
[[redirects]]
  from = "/og/the-words-came-first-card-1200x630.png"
  to = "/og/watchmans-desk/the-words-came-first.v2.png"
  status = 301
[[redirects]]
  from = "/og/the-words-came-first-thumb-1280x720.png"
  to = "/og/watchmans-desk/the-words-came-first-thumb.png"
  status = 301

# Retired duplicate: the short "Joint Heirs" blog now points at the full
# Five Titles chapter, so inbound links and search results keep resolving.
[[redirects]]
  from = "/blog/joint-heirs-thrones-inheritance"
  to = "/blog/joint-heirs-with-the-king"
  status = 301

# Retired duplicate: "The Image of Yahuah" was a strict subset of the Bearer
# chapter, which now anchors the-second-adam cluster. Point inbound links and
# search results at the full chapter.
[[redirects]]
  from = "/blog/the-image-of-yahuah"
  to = "/blog/the-bearer-2-unseen-and-image"
  status = 301

# Trinity Studies category retired: the trinity-examined association cluster now
# does the grouping. The listing page is gone; send it to the anchor study.
[[redirects]]
  from = "/trinity/studies"
  to = "/blog/the-throne-and-the-right-hand"
  status = 301

# The Lie of Gravity moved from a /sun-worship/the-priesthood article page to a
# taggable blog post so it can join the cosmology-north cluster.
[[redirects]]
  from = "/sun-worship/the-priesthood/gravity"
  to = "/blog/the-lie-of-gravity"
  status = 301

# The Watchman's Letter retitled: "Not Your Own" -> "A Temple, and Nobody Asked
# Whose". Keep the old letter URL resolving to the new one.
[[redirects]]
  from = "/watchmans-desk/not-your-own"
  to = "/watchmans-desk/a-temple-and-nobody-asked-whose"
  status = 301

# Scripture Insights became the two-lane "Close to the Hip" page. Keep the old URL
# resolving to the new one (trailing-slash variant covered explicitly).
[[redirects]]
  from = "/scripture-insights"
  to = "/close-to-the-hip"
  status = 301
[[redirects]]
  from = "/scripture-insights/"
  to = "/close-to-the-hip"
  status = 301
