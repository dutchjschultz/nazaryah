<style>
/* Layout: a one-column phone handbook. Every sound is a reference card with a printed footnote at its foot.

:root {

  --tooth: #fbfdf9;
  --tongue: #e8a79f;
  --on-tongue: #4a1512;
  --lip: #a8443e;
  --hit: #c2302a;

    --mouth: #2c3560; --tooth: #e9eee8; --tongue: #e8a79f; --on-tongue: #4a1512; --lip: #d9716a; --hit: #ffb340;
    --t-m: #a9bac8; --t-l: #94a8ff; --t-f: #ff8d7d; --t-h: #55d6a8; --t-r: #f2b632;
    --w0: #cfa2f2; --w1: #5fd3dc; --w2: #f3a07a; --w3: #b9d96c; --good: #55d6a8; --bad: #ff8d7d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {

function plainSyl(p){
  let w=p.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(), out='';

  if(on){const base=ONS.find(o=>ONMAP[o]&&on.startsWith(o)&&(on.length===o.length||/^[rlw]$/.test(on.slice(o.length))));

/* ---------- speech ---------- */
function loadVoice(){
  if(!('speechSynthesis' in window)){voiceState='none';return}
  const v=speechSynthesis.getVoices();
  voice=v.find(x=>/^th/i.test(x.lang))||null;
  voiceState=voice?'ready':(v.length?'nothai':'checking');
}
function say(text){
  text=text.replace(/\.\.\./g,'');
  if(!('speechSynthesis' in window)){toast('This view has no speech engine. Open the page in Safari or Chrome to hear Thai.');return}
  loadVoice();
  if(voiceState==='nothai'){toast('This device has no Thai voice. Add Thai in its text-to-speech settings.');return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='th-TH'; u.rate=parseFloat(rate); if(voice)u.voice=voice;
  u.onerror=e=>{if(e.error&&e.error!=='canceled'&&e.error!=='interrupted')toast('The Thai voice could not play here. Open the page in Safari or Chrome.')};
  speechSynthesis.speak(u);
}

function footnote(s){
  const ms=Array.isArray(s.m)?s.m:(s.m?[s.m]:null);
  const figs=ms?`<div class="figs${ms.length>1?' two':''}">${ms.map(k=>`<button class="bigbtn" data-big="${k}" aria-label="Show this drawing large">${mouth(k,true)}</button>`).join('<span class="ar" aria-hidden="true">→</span>')}</div>`:'';
  const [a,b,c,d]=s.f;
  return `<div class="fn"${ms?'':' style="grid-template-columns:minmax(0,1fr)"'}>${figs}<p><span class="n">${s.n}</span><b>Tongue:</b> ${a} <b>Teeth:</b> ${b} <b>Lips:</b> ${c} <b>Air and voice:</b> ${d}</p></div>`;
}
function soundCard(s){
  return `<article class="card"><div class="snd-head"><div class="key">${s.k}<sup>${s.n}</sup></div><div class="thaiset" lang="th">${s.th}</div>${sayBtn(s.w[0],s.w[2])}</div>
  <p class="like">${s.like}</p>${SMILE.includes(s.k)?`<p class="smile">${SMI}<span>Smile on this sound. Wide lips help it come out right.</span></p>`:''}
  <div class="word"><span class="tw" lang="th">${s.w[0]}</span>${ph(s.w[1])}<span class="en">${s.w[2]}</span></div>${footnote(s)}</article>`;
}

function voiceNote(){
  if(voiceState==='ready')return `Thai voice ready: ${voice.name}. The speaker buttons read each word aloud, and the Slow switch at the top slows them down.`;
  if(voiceState==='none')return 'This view has no speech engine, so the speaker buttons stay silent. Open the page in Safari or Chrome for sound.';
  if(voiceState==='nothai')return 'No Thai voice is installed on this device. Add Thai in its text-to-speech or spoken content settings, then reopen this page.';
  return 'Press any speaker button to test the Thai voice.';
}

/* ---------- word list ----------
   Each line: English | Thai | spelling | meaning of each part | other English words that find it | polite ending (s or q)
   In the Thai, · splits syllables and a space splits the separate words inside it.
   A line starting with # sets the group, which picks the example sentence. */
function parseWords(raw){
 const out=[]; let cat='word';
 raw.split('\n').forEach(line=>{
  line=line.trim(); if(!line||line.startsWith('//'))return;
  if(line[0]==='#'){cat=line.slice(1).trim();return}
  const f=line.split('|').map(x=>x.trim());
  const [en,thSplit,phs,mean='',also='',pol='']=f;
  out.push({en,thSplit,th:thSplit.replace(/~./g,'').replace(/[· ]/g,''),ph:phs,means:mean?mean.split(';').map(x=>x.trim()):null,also,pol,cat});
 });
 return out;
}

 let init=null; if(cs.length){init=cs.shift();role[init]='init'}

  if(new RegExp('\\b'+esc+'\\b').test(t))return 1+(e.cat==='phrase'?1:0); if(en.startsWith(q))return 3; if(t.includes(q)||e.th.includes(q))return 4; return 9};

function render(keep){
 loadVoice();
 if(!V[view])view='start';
 app.innerHTML=V[view]();
 document.getElementById('tabs').innerHTML=NAV.map(n=>`<button data-go="${n[0]}"${n[0]===view?' aria-current="page"':''}><span class="g" lang="th">${n[1]}</span><span>${n[2]}</span></button>`).join('');
 if(!keep)window.scrollTo(0,0);
}
function go(v){view=v;store.set('view',v);try{history.replaceState(null,'','#'+v)}catch(e){location.hash=v}render()}
document.addEventListener('click',e=>{
 const b=e.target.closest('button'); if(!b)return; const d=b.dataset;
 if(d.say){say(d.say);return}
 if(d.pick){findQ=d.pick;findSel=null;render();return}
 if(d.open){const en=entryByTh(d.open);findSel=d.open;if(en)findQ=en.en;go('find');return}
 if(d.big){const b=document.getElementById('bigv');b.innerHTML=`<div class="in"><h2>How to read the drawing</h2>${mouth(d.big)}<p>This is a head cut in half and seen from the side, with the face looking left. The lips and teeth are on the left and the throat is on the right.</p><p>The pink band is the tongue. Its tip points left toward the teeth. Its back sits on the right, near the soft roof of the mouth.</p><p>The red circle marks the spot where the mouth does the work. Red dashes mean the air leaves through the nose. A vowel drawing has no circle, because only the shape of the tongue matters.</p><button class="next" data-unbig="1" style="justify-self:start">Close</button></div>`;b.hidden=false;b.scrollTop=0;return}
 if(d.unbig){document.getElementById('bigv').hidden=true;return}
 if(d.les){lesson=LESSONS.find(l=>l.id===d.les);T=null;render();return}
 if(d.lback){lesson=null;T=null;render();return}
 if(d.lreview){T=null;render();return}
 if(d.ltest){T={i:0,right:0,order:shuffle(lesson.w)};testOpts();render();return}
 if(d.lpick){T.picked=+d.lpick;if(T.opts[T.picked]===T.order[T.i])T.right++;render(true);return}
 if(d.lnext){T.i++;if(T.i<T.order.length){testOpts();render()}else{donej[lesson.id]=Math.max(donej[lesson.id]||0,T.right);store.set('done',JSON.stringify(donej));render()}return}
 if(d.go){go(d.go);return}
 if(d.speaker){speaker=d.speaker;store.set('speaker',speaker);render(true);return}
 if(d.soundtab){soundTab=d.soundtab;render(true);return}
 if(d.phrasetab){phraseTab=d.phrasetab;render(true);return}
 if(d.lfilter){letterFilter=d.lfilter;render(true);return}
 if(d.letter){letterSel=d.letter;render(true);document.getElementById('ldetail').scrollIntoView({block:'center'});return}
 if(d.drill){drillSet=d.drill;newQ();render(true);return}
 if(d.opt){q.picked=+d.opt;score[1]++;if(q.opts[q.picked]===q.ans)score[0]++;render(true);return}
 if(d.next){newQ();render(true);if(voiceState!=='none'&&voiceState!=='nothai')say(q.ans[0]);return}
});
function setRate(r){rate=r;store.set('rate',r);document.getElementById('spd-n').setAttribute('aria-pressed',r==='0.9');document.getElementById('spd-s').setAttribute('aria-pressed',r==='0.55')}
document.getElementById('spd-n').onclick=()=>setRate('0.9');
document.getElementById('spd-s').onclick=()=>setRate('0.55');
document.addEventListener('input',e=>{if(e.target.id==='find-q'){findQ=e.target.value;findSel=null;document.getElementById('find-out').innerHTML=findOut()}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(V[h]&&h!==view){view=h;render()}});
if('speechSynthesis' in window)speechSynthesis.addEventListener?.('voiceschanged',()=>{loadVoice();const n=document.getElementById('voice-note');if(n)n.textContent=voiceNote()});
setRate(rate); view=current(); render();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}</script>
</body>
</html>
