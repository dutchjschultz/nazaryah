<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#232e6e">
<meta name="description" content="Learn to speak Thai by sound.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Say It in Thai">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Say It in Thai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Sarabun:wght@400;600;700&family=Trirong:wght@500;700&display=swap">
<style>
/* Layout: a one-column phone handbook. Every sound is a reference card with a printed footnote at its foot.
   Pitch curves ride above each spoken syllable, like notes above a hymn line. */
:root {
  --bg: #dbe6de;        /* Sukhothai celadon glaze */
  --leaf: #f1f5ef;      /* card paper */
  --ink: #161d42;       /* indigo-dyed ink */
  --soft: #4a5570;
  --line: #b4c4bb;
  --lac: #232e6e;       /* indigo silk */
  --on-lac: #f1f5ef;
  --gold: #8f5a00;      /* marigold, darkened for text */
  --mouth: #cfd9d2;
  --tooth: #fbfdf9;
  --tongue: #d98a84;
  --hit: #c2302a;
  --t-m: #52626f;
  --t-l: #2f4bb8;
  --t-f: #c2302a;
  --t-h: #0b7a57;
  --t-r: #a35b00;
  --good: #0b7a57;
  --bad: #c2302a;
  --f-thai: "Trirong", "Noto Serif Thai", Georgia, serif;
  --f-body: "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
  --f-phon: "Noto Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10142a; --leaf: #1a2042; --ink: #dfe9e2; --soft: #a4b0c4; --line: #36406a;
    --lac: #2c387f; --on-lac: #f1f5ef; --gold: #f2b632;
    --mouth: #2c3560; --tooth: #e9eee8; --tongue: #c9746e; --hit: #ffb340;
    --t-m: #a9bac8; --t-l: #94a8ff; --t-f: #ff8d7d; --t-h: #55d6a8; --t-r: #f2b632;
    --good: #55d6a8; --bad: #ff8d7d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10142a; --leaf: #1a2042; --ink: #dfe9e2; --soft: #a4b0c4; --line: #36406a;
  --lac: #2c387f; --on-lac: #f1f5ef; --gold: #f2b632;
  --mouth: #2c3560; --tooth: #e9eee8; --tongue: #c9746e; --hit: #ffb340;
  --t-m: #a9bac8; --t-l: #94a8ff; --t-f: #ff8d7d; --t-h: #55d6a8; --t-r: #f2b632;
  --good: #55d6a8; --bad: #ff8d7d; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 17px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--lac); }
.wrap { max-width: 640px; margin-inline: auto; display: grid; gap: 20px; min-width: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--lac); color: var(--on-lac);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px;
}
.top strong { font: 700 18px/1.2 var(--f-thai); }
.speed { display: flex; border: 1px solid var(--on-lac); border-radius: 4px; overflow: hidden; flex: none; }
.speed button { background: none; border: 0; color: var(--on-lac); padding: 6px 14px; font-size: 15px; min-height: 36px; }
.speed button[aria-pressed="true"] { background: var(--on-lac); color: var(--lac); font-weight: 700; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--leaf); border-top: 2px solid var(--lac);
  display: grid; grid-template-columns: repeat(7, 1fr);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
nav.tabs button { background: none; border: 0; padding: 6px 0 8px; display: grid; justify-items: center; gap: 0; font-size: 12px; min-width: 0; color: var(--soft); }
nav.tabs .g { font: 700 21px/1.35 var(--f-thai); }
nav.tabs button[aria-current="page"] { color: var(--ink); font-weight: 700; box-shadow: inset 0 3px 0 var(--gold); }

h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.2; }
h1 { font: 700 30px/1.2 var(--f-thai); }
h2 { font: 700 23px/1.25 var(--f-thai); }
h3 { font: 700 18px/1.3 var(--f-body); }
p { margin: 0; }
.lede { color: var(--soft); max-width: 62ch; }
.stack { display: grid; gap: 12px; min-width: 0; }
.eyebrow { font: 600 13px/1.3 var(--f-phon); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }

.hero { display: grid; gap: 6px; padding-block: 8px; }
.hero .big { font: 700 clamp(64px, 21vw, 112px)/1.25 var(--f-thai); color: var(--lac); }
:root:not([data-theme="light"]) .hero .big { color: inherit; }
.staffed { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* phonetic spelling with pitch curves */
.ph { display: inline-flex; flex-wrap: wrap; align-items: flex-end; column-gap: 1px; row-gap: 4px; font: 600 1.1em/1.2 var(--f-phon); }
.syl { display: inline-grid; justify-items: center; }
.syl svg { width: 1.7em; height: .95em; display: block; }
.syl svg path { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.phw { display: inline-grid; gap: 2px; min-width: 0; justify-items: inherit; }
.plain { font: 600 .82em/1.25 var(--f-body); color: var(--gold); }
.sep { align-self: flex-end; color: var(--soft); padding-inline: 1px; }
.sp { width: .4em; }
.t-m { color: var(--t-m); } .t-l { color: var(--t-l); } .t-f { color: var(--t-f); } .t-h { color: var(--t-h); } .t-r { color: var(--t-r); }

.say {
  background: var(--lac); color: var(--on-lac); border: 0; border-radius: 50%;
  width: 44px; height: 44px; display: grid; place-items: center; flex: none;
}
.say svg { width: 22px; height: 22px; fill: currentColor; }
.say:active { transform: scale(.94); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: none; border: 1.5px solid var(--lac); color: var(--ink); border-radius: 4px; padding: 7px 12px; min-height: 40px; font-size: 16px; }
:root .chip[aria-pressed="true"] { background: var(--lac); color: var(--on-lac); font-weight: 700; }

.card { background: var(--leaf); border-radius: 6px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.card.flat { background: none; padding: 0; }
.snd-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.key { font: 700 34px/1.1 var(--f-phon); color: var(--lac); }
:root .key { color: var(--ink); }
.key sup { font: 700 13px/1 var(--f-phon); color: var(--gold); margin-left: 2px; vertical-align: super; }
.thaiset { font: 500 24px/1.3 var(--f-thai); }
.word { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 10px; }
.word .tw { font: 500 26px/1.3 var(--f-thai); }
.word .en { color: var(--soft); }
.like { color: var(--ink); }
.fn { border-top: 1px solid var(--line); padding-top: 10px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; font-size: 15px; line-height: 1.42; }
.fn .figs { display: flex; align-items: center; gap: 2px; }
.fn svg.mo { width: 100px; height: auto; display: block; }
.fn .ar { color: var(--soft); font-size: 16px; }
.fn .n { font: 700 13px/1 var(--f-phon); color: var(--gold); vertical-align: super; margin-right: 3px; }
.fn b { font-weight: 700; }
.fn .figs.two svg.mo { width: 74px; }
.fn:has(.figs.two) { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 380px) { .fn { grid-template-columns: minmax(0, 1fr); } }

.mo .m { fill: var(--mouth); }
.mo .o { fill: none; stroke: var(--soft); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.mo .tt { fill: var(--tooth); stroke: var(--soft); stroke-width: .9; }
.mo .tg { fill: var(--tongue); }
.mo .lip { fill: var(--tongue); opacity: .75; }
.mo .hit { fill: none; stroke: var(--hit); stroke-width: 2.2; }
.mo .air { fill: none; stroke: var(--hit); stroke-width: 1.5; stroke-dasharray: 3 3; stroke-linecap: round; }

.rule { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: start; border-top: 1px solid var(--line); padding-top: 12px; }
.rule .mk { font: 700 22px/1.3 var(--f-phon); color: var(--gold); text-align: center; }
.keyrow { display: grid; grid-template-columns: 3.6em minmax(0, 1fr); gap: 4px 12px; align-items: baseline; }
.keyrow b { font: 700 18px/1.3 var(--f-phon); }
.note { background: var(--lac); color: var(--on-lac); border-radius: 6px; padding: 14px; display: grid; gap: 6px; }
.note a { color: inherit; }
.tone-head { display: flex; align-items: center; gap: 14px; }
.tone-head svg { width: 72px; height: 42px; flex: none; }
.tone-head svg path { fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; }
.tone-head svg line { stroke: var(--line); stroke-width: 1; }
.tone-mark { font: 700 26px/1 var(--f-phon); }

.grid44 { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; }
.lt { background: var(--leaf); border: 0; border-radius: 4px; padding: 6px 2px; display: grid; justify-items: center; font-size: 13px; line-height: 1.25; color: var(--soft); min-width: 0; }
.lt .g { font: 500 34px/1.35 var(--f-thai); color: var(--ink); }
.lt[aria-pressed="true"] { outline: 2.5px solid var(--gold); outline-offset: -2.5px; }
.lt.old .g { opacity: .55; }
.bigl { font: 500 84px/1.2 var(--f-thai); }
.lhead { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.tag { display: inline-block; border: 1.5px solid currentColor; border-radius: 3px; padding: 0 6px; font: 600 13px/1.5 var(--f-phon); }
.marks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.mk-item { background: var(--leaf); border-radius: 4px; padding: 8px 10px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.mk-item .g { font: 500 30px/1.3 var(--f-thai); }

.phr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; border-bottom: 1px solid var(--line); padding-block: 12px; }
.phr .tw { font: 500 23px/1.35 var(--f-thai); }
.phr .en { color: var(--soft); }
.phr .body { display: grid; gap: 2px; min-width: 0; }

.drill { background: var(--leaf); border-radius: 6px; padding: 16px; display: grid; gap: 14px; justify-items: center; text-align: center; }
.drill .say { width: 76px; height: 76px; }
.drill .say svg { width: 36px; height: 36px; }
.opts { display: grid; gap: 8px; width: 100%; }
.opt { background: none; border: 1.5px solid var(--lac); border-radius: 4px; padding: 10px; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 4px 12px; min-height: 52px; }
.opt.right { border-color: var(--good); box-shadow: inset 0 0 0 1.5px var(--good); }
.opt.wrong { border-color: var(--bad); box-shadow: inset 0 0 0 1.5px var(--bad); }
.opt .en { color: var(--soft); }
.next { background: var(--lac); color: var(--on-lac); border: 0; border-radius: 4px; padding: 10px 22px; min-height: 44px; font-weight: 700; }
.score { font-variant-numeric: tabular-nums; color: var(--soft); }

.lessons { display: grid; gap: 8px; }
.ltile { background: var(--leaf); border: 0; border-radius: 6px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; text-align: left; min-height: 72px; }
.ltile .nm { font: 700 18px/1.3 var(--f-body); color: var(--ink); }
.ltile .sub { color: var(--soft); font-size: 15px; }
.ltile .thn { grid-row: 1 / span 2; grid-column: 2; font: 500 24px/1.3 var(--f-thai); color: var(--ink); text-align: right; }
.ltile .st { color: var(--good); font-weight: 600; }
.back { background: none; border: 0; padding: 6px 0; min-height: 40px; color: var(--gold); font-weight: 700; justify-self: start; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 11; max-width: 560px; margin-inline: auto; background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 6px; font-size: 15px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>
<body>
<div class="top">
  <strong>Say It in Thai</strong>
  <div class="speed" role="group" aria-label="Voice speed">
    <button id="spd-n" aria-pressed="true">Normal</button>
    <button id="spd-s" aria-pressed="false">Slow</button>
  </div>
</div>
<main class="wrap" id="app"></main>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ---------- mouth drawing, seen from the side, facing left ---------- */
const SH = {
  rest:{t:[31,62],h:[58,58]},
  lab:{t:[31,62],h:[58,58],lip:'closed',hit:[15,52]},
  labn:{t:[31,62],h:[58,58],lip:'closed',hit:[15,52],nose:1},
  fv:{t:[31,62],h:[58,58],lip:'f',hit:[22,52]},
  alv:{t:[29,41],h:[54,56],lip:'open',hit:[29,39]},
  alvn:{t:[29,41],h:[54,56],lip:'open',hit:[29,39],nose:1},
  sib:{t:[30,47],h:[52,50],lip:'near',hit:[30,42]},
  tap:{t:[34,39],h:[58,56],lip:'open',hit:[34,37]},
  pal:{t:[34,58],h:[50,34],lip:'open',hit:[50,31]},
  yy:{t:[33,58],h:[50,39],lip:'near',hit:[50,35]},
  vel:{t:[32,66],h:[74,36],lip:'open',hit:[74,33]},
  veln:{t:[32,66],h:[74,36],lip:'open',hit:[74,33],nose:1},
  ww:{t:[32,66],h:[74,40],lip:'round',hit:[12,52]},
  gl:{t:[31,62],h:[58,60],lip:'open',hit:[92,92]},
  i:{t:[32,60],h:[52,38],lip:'spread'},
  e:{t:[32,62],h:[52,45],lip:'open'},
  ae:{t:[32,66],h:[54,54],lip:'open',jaw:5},
  a:{t:[33,70],h:[60,64],lip:'open',jaw:9},
  ue:{t:[32,66],h:[74,39],lip:'spread'},
  er:{t:[32,66],h:[72,47],lip:'open',jaw:2},
  u:{t:[32,66],h:[74,38],lip:'round'},
  o:{t:[32,66],h:[74,45],lip:'round',jaw:2},
  aw:{t:[32,68],h:[74,54],lip:'round',jaw:6}
};
function mouth(key){
  const s = SH[key] || SH.rest, j = s.jaw||0, [tx,ty]=s.t, [hx,hy]=s.h, lip=s.lip||'open';
  let up=[14,46,7,5], lo=[14,60+j,7,5];
  if(lip==='closed'){up=[14,47,7,5];lo=[14,57,7,5];}
  if(lip==='near'){lo=[14,58,7,5];}
  if(lip==='round'){up=[10,47,5,5];lo=[10,57+j,5,5];}
  if(lip==='spread'){up=[16,46,7,4];lo=[16,58+j,7,4];}
  if(lip==='f'){lo=[21,57,6,5];}
  const tongue=`M30 ${84+j} Q${tx-3} ${ty+8} ${tx} ${ty} C${tx+8} ${ty-5} ${hx-16} ${hy} ${hx} ${hy} C${hx+13} ${hy} 86 ${Math.max(hy+14,62)} 87 84 L87 104 L36 104 Z`;
  const velum=s.nose?'M58 29 Q74 30 84 48':'M58 29 Q80 30 97 39';
  const air=s.nose?`<path class="air" d="M92 52 Q92 30 70 22 L28 22"/>`:'';
  const hit=s.hit?`<circle class="hit" cx="${s.hit[0]}" cy="${s.hit[1]}" r="6"/>`:'';
  return `<svg class="mo" viewBox="0 0 110 106" role="img" aria-label="Side view of the mouth">
<path class="m" d="M24 38 Q30 33 34 34 Q46 26 58 29 L98 16 L98 10 L26 10 Z"/>
<path class="o" d="M26 4 L6 30 L13 37"/>
<path class="o" d="M24 38 Q30 33 34 34 Q46 26 58 29"/>
<path class="o" d="${velum}" stroke-width="3"/>
<path class="o" d="M30 16 Q70 12 98 22 L99 104"/>
<path class="tg" d="${tongue}"/>
<path class="tt" d="M21 39 L28 38 L27 51 L23 51 Z"/>
<path class="tt" d="M22 ${58+j} L26 ${58+j} L28 ${70+j} L21 ${70+j} Z"/>
<ellipse class="lip" cx="${up[0]}" cy="${up[1]}" rx="${up[2]}" ry="${up[3]}"/>
<ellipse class="lip" cx="${lo[0]}" cy="${lo[1]}" rx="${lo[2]}" ry="${lo[3]}"/>
<path class="o" d="M${lo[0]-3} ${lo[1]+5} Q10 ${80+j} 22 ${90+j} L36 ${100+j}"/>
${air}${hit}</svg>`;
}

/* ---------- pitch curves ---------- */
const CURVE = {
  m:'M3 8 L25 8', l:'M3 10 Q14 12 25 14', f:'M3 8 Q8 1 14 3 Q20 6 25 14',
  h:'M3 7 Q14 8 25 2', r:'M3 9 Q11 15 16 12 Q21 9 25 3'
};
function toneOf(s){
  const n=s.normalize('NFD');
  if(n.includes('̀'))return 'l';
  if(n.includes('́'))return 'h';
  if(n.includes('̂'))return 'f';
  if(n.includes('̌'))return 'r';
  return 'm';
}
const ONS=['khr','khl','khw','phr','phl','kr','kl','kw','pr','pl','tr','ph','th','kh','ng','ch','k','p','t','j','b','d','f','h','l','m','n','r','s','w','y'];
const ONMAP={ph:'p',th:'t',kh:'k',k:'g',p:'bp',t:'dt',j:'dj'};
const NUC=[['aaeo','aew'],['aawy','awwy'],['aai','ahy'],['aao','ahw'],['aae','aae'],['aaw','aww'],['aa','ah'],['ae','ae'],['ai','ai'],['ao','ao'],['awy','awy'],['aw','aw'],['ay','ay'],['a','uh'],
 ['uea','eua'],['uue','euu'],['ue','eu'],['uay','ooay'],['ua','ooa'],['ui','ooey'],['oo','ooo'],['u','oo'],['iao','eeow'],['ia','eea'],['iu','ew'],['ee','ee'],['i','i'],
 ['oh','ohh'],['o','oh'],['err','err'],['er','er'],['e','eh']];
function plainSyl(p){
  let w=p.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(), out='';
  const on=ONS.find(o=>w.startsWith(o));
  if(on){const base=ONS.find(o=>ONMAP[o]&&on.startsWith(o)&&(on.length===o.length||/^[rlw]$/.test(on.slice(o.length))));
    out=base?ONMAP[base]+on.slice(base.length):on; w=w.slice(on.length)}
  const n=NUC.find(x=>w.startsWith(x[0]));
  if(n){out+=n[1];w=w.slice(n[0].length)}
  return out+w;
}
function plain(str){return str.split(/([ \-])/).map(p=>/[a-zA-Z\u00C0-\u024F]/.test(p)?plainSyl(p):p).join('')}
function ph(str){
  return '<span class="phw"><span class="ph" lang="und-Latn">'+str.split(/([ \-])/).map(p=>{
    if(p===' ')return '<span class="sp"></span>';
    if(p==='-')return '<span class="sep">-</span>';
    if(!/[a-zA-ZÀ-ɏ]/.test(p))return `<span class="sep">${p}</span>`;
    const t=toneOf(p);
    return `<span class="syl t-${t}"><svg viewBox="0 0 28 16" aria-hidden="true"><path d="${CURVE[t]}"/></svg><span>${p}</span></span>`;
  }).join('')+'</span><span class="plain">Say: '+plain(str)+'</span></span>';
}

/* ---------- sound data: the footnote is always tongue, teeth, lips, air ---------- */
const CONS = [

/* ---------- speech ---------- */
function loadVoice(){
  if(!('speechSynthesis' in window)){voiceState='none';return}
  const v=speechSynthesis.getVoices();
  voice=v.find(x=>/^th/i.test(x.lang))||null;
  voiceState=voice?'ready':(v.length?'nothai':'checking');
}
function say(text){
  text=text.replace(/\.\.\./g,'');
  if(!('speechSynthesis' in window)){toast('This view has no speech engine. Open the page in Safari or Chrome to hear Thai.');return}
  loadVoice();
  if(voiceState==='nothai'){toast('This device has no Thai voice. Add Thai in its text-to-speech settings.');return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='th-TH'; u.rate=parseFloat(rate); if(voice)u.voice=voice;
  u.onerror=e=>{if(e.error&&e.error!=='canceled'&&e.error!=='interrupted')toast('The Thai voice could not play here. Open the page in Safari or Chrome.')};
  speechSynthesis.speak(u);
}

 <div class="grid44">${list.map(x=>`<button class="lt${x[7]?' old':''}" data-letter="${x[0]}" aria-pressed="${x[0]===letterSel}"><span class="g" lang="th">${x[0]}</span><span>${x[5]==='(catch)'?'catch':x[5]}</span></button>`).join('')}</div>
 <section class="stack"><h2>Vowel marks</h2><p class="lede">Vowels sit above, below, before or after the consonant, and the consonant is always said first. Thai leaves no spaces between words. Here ก stands in for any consonant.</p>
 <div class="marks">${MARKS.map(m=>`<div class="mk-item"><span class="g" lang="th">${m[0]}</span><span style="font:600 17px var(--f-phon)">${m[1]}<span class="plain" style="display:block;font-size:14px">Say: ${plain(m[1])}</span></span></div>`).join('')}</div></section>
 <section class="stack"><h2>Tone marks and letter classes</h2><p class="lede">Four small marks sit above the consonant. The tone they give depends on the class of the first letter, which is why each letter belongs to a class.</p>
 <div class="rule"><div class="mk" lang="th">ก่</div><div><h3>First mark</h3><p>Low tone after mid and high class. Falling tone after low class.</p></div></div>
 <div class="rule"><div class="mk" lang="th">ก้</div><div><h3>Second mark</h3><p>Falling tone after mid and high class. High tone after low class.</p></div></div>
 <div class="rule"><div class="mk" lang="th">ก๊</div><div><h3>Third mark</h3><p>High tone. Used with mid class letters only.</p></div></div>
 <div class="rule"><div class="mk" lang="th">ก๋</div><div><h3>Fourth mark</h3><p>Rising tone. Used with mid class letters only.</p></div></div>
 <div class="rule"><div class="mk">—</div><div><h3>No mark</h3><p>In a syllable ending on a vowel or on m, n, ng, w or y, mid and low class give mid tone, and high class gives rising tone. Syllables ending in k, t or p follow further rules.</p></div></div></section>`;
};
V.phrases=()=>{
 const pol=speaker==='m'?{s:['ครับ','khráp'],q:['ครับ','khráp']}:{s:['ค่ะ','khâ'],q:['คะ','khá']};
 const I=speaker==='m'?['ผม','phǒm']:['ฉัน','chǎn'];
 return `<h1>Phrases</h1><p class="lede">The polite ending is added automatically. Thai changes it by who is speaking.</p>
 <div class="chips" role="group" aria-label="Speaker"><button class="chip" data-speaker="m" aria-pressed="${speaker==='m'}">Man speaking</button><button class="chip" data-speaker="f" aria-pressed="${speaker==='f'}">Woman speaking</button></div>
 <div class="chips">${Object.keys(PHRASES).map(k=>`<button class="chip" data-phrasetab="${k}" aria-pressed="${k===phraseTab}">${k}</button>`).join('')}</div>
 <div>${PHRASES[phraseTab].map(p=>{
   const tail=p[3]?pol[p[3]]:['',''];
   const th=p[0].replace('{I}',I[0]), sp=p[1].replace('{I}',I[1]);
   const full=th+tail[0], spoken=sp+(tail[1]?' '+tail[1]:'');
   return `<div class="phr"><div class="body"><span class="tw" lang="th">${full}</span><span style="font-size:18px">${ph(spoken)}</span><span class="en">${p[2]}</span></div>${sayBtn(full,p[2])}</div>`}).join('')}</div>`;
};
V.practice=()=>{
 if(!q)newQ();
 const silent=voiceState==='none'||voiceState==='nothai';
 return `<h1>Drill</h1><p class="lede">${silent?'No Thai voice is available here, so each question shows the Thai word to read.':'Press the speaker, then pick the word that was spoken. These pairs differ by a single feature.'}</p>
 <div class="chips">${Object.keys(DRILLS).map(k=>`<button class="chip" data-drill="${k}" aria-pressed="${k===drillSet}">${k}</button>`).join('')}</div>
 <section class="drill" id="drillbox">${drillBody(silent)}</section>`;
};
function drillBody(silent){
 const done=q.picked!=null;
 return `${silent?`<div class="bigl" lang="th" style="font-size:60px">${q.ans[0]}</div>`:sayBtn(q.ans[0],'the word')}
 <div class="opts">${q.opts.map((o,i)=>{
   let c=''; if(done){if(o===q.ans)c=' right'; else if(i===q.picked)c=' wrong'}
   return `<button class="opt${c}" data-opt="${i}" ${done?'disabled':''}><span style="font-size:20px">${ph(o[1])}</span><span class="en">${o[2]}</span></button>`}).join('')}</div>
 ${done?`<p><span lang="th" style="font:500 24px var(--f-thai)">${q.ans[0]}</span> ${q.opts[q.picked]===q.ans?'Correct.':'That word was '+q.ans[1]+'.'}</p><button class="next" data-next="1">Next word</button>`:''}
 <p class="score">Correct so far: ${score[0]} of ${score[1]}</p>`;
}
function newQ(){
 const groups=DRILLS[drillSet], g=groups[Math.floor(Math.random()*groups.length)];
 q={opts:g,ans:g[Math.floor(Math.random()*g.length)],picked:null};
}

function tail(kind){const p=speaker==='m'?{s:['ครับ','khráp'],q:['ครับ','khráp']}:{s:['ค่ะ','khâ'],q:['คะ','khá']};return kind?p[kind]:['','']}
function fill(p){const I=speaker==='m'?['ผม','phǒm']:['ฉัน','chǎn'],t=tail(p[3]);return [p[0].replace('{I}',I[0])+t[0],p[1].replace('{I}',I[1])+(t[1]?' '+t[1]:'')]}
V.lessons=()=>{
 if(lesson&&T)return testView();
 if(lesson)return learnView();
 const n=LESSONS.filter(l=>donej[l.id]).length;
 return `<h1>Lessons</h1><p class="lede">Each lesson is a short list of everyday words with a small test at the end. Lessons finished so far: ${n} of ${LESSONS.length}.</p>
 <div class="lessons">${LESSONS.map(l=>`<button class="ltile" data-les="${l.id}"><span class="nm">${l.title}</span><span class="thn" lang="th">${l.th}</span><span class="sub">${l.w.length} words${donej[l.id]?` · <span class="st">Best test ${donej[l.id]} of ${l.w.length}</span>`:''}</span></button>`).join('')}</div>`;
};
function learnView(){
 const l=lesson, s=ALL.find(x=>x.k===l.tip), u=fill(l.use);
 return `<button class="back" data-lback="1">‹ All lessons</button><h1>${l.title}</h1><p class="lede">${l.note}</p>
 <div>${l.w.map(w=>`<div class="phr"><div class="body"><span class="tw" lang="th">${w[0]}</span><span style="font-size:18px">${ph(w[1])}</span><span class="en">${w[2]}</span></div>${sayBtn(w[0],w[2])}</div>`).join('')}</div>
 <section class="card"><h3>Use it in a sentence</h3><div class="word"><span class="tw" lang="th">${u[0]}</span></div><div class="staffed">${sayBtn(u[0],l.use[2])}<span style="font-size:18px">${ph(u[1])}</span></div><p style="color:var(--soft)">${l.use[2]}</p></section>
 <section class="card"><h3>Sound to watch: ${s.k}</h3><p class="like">${s.like}</p>${footnote(s)}</section>
 <button class="next" data-ltest="1" style="justify-self:start">Take the test</button>`;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function testOpts(){const w=T.order[T.i];T.opts=shuffle([w,...shuffle(lesson.w.filter(x=>x!==w)).slice(0,2)]);T.picked=null}
function testView(){
 const l=lesson;
 if(T.i>=T.order.length){
  return `<button class="back" data-lback="1">‹ All lessons</button><section class="drill"><h1>${T.right} of ${T.order.length}</h1><p>${l.title} is finished. ${T.right===T.order.length?'Every word was correct.':'Another run tests every word again.'}</p><button class="next" data-ltest="1">Test again</button><button class="back" data-lreview="1">Review the words</button></section>`;
 }
 const w=T.order[T.i], done=T.picked!=null;
 return `<button class="back" data-lreview="1">‹ ${l.title}</button><section class="drill"><p class="score">Word ${T.i+1} of ${T.order.length}</p>
 <div class="bigl" lang="th" style="font-size:52px">${w[0]}</div><div style="font-size:21px">${ph(w[1])}</div>${sayBtn(w[0],'the word')}
 <div class="opts">${T.opts.map((o,i)=>{let c='';if(done){if(o===w)c=' right';else if(i===T.picked)c=' wrong'}return `<button class="opt${c}" data-lpick="${i}" ${done?'disabled':''}><span>${o[2]}</span></button>`}).join('')}</div>
 ${done?`<button class="next" data-lnext="1">${T.i+1<T.order.length?'Next word':'See the result'}</button>`:''}</section>`;
}

/* ---------- routing and events ---------- */
const app=document.getElementById('app');
function current(){const h=location.hash.slice(1);return V[h]?h:store.get('view','start')}
let view='start';
function render(keep){
 loadVoice();
 if(!V[view])view='start';
 app.innerHTML=V[view]();
 document.getElementById('tabs').innerHTML=NAV.map(n=>`<button data-go="${n[0]}"${n[0]===view?' aria-current="page"':''}><span class="g" lang="th">${n[1]}</span><span>${n[2]}</span></button>`).join('');
 if(!keep)window.scrollTo(0,0);
}
function go(v){view=v;store.set('view',v);try{history.replaceState(null,'','#'+v)}catch(e){location.hash=v}render()}
document.addEventListener('click',e=>{
 const b=e.target.closest('button'); if(!b)return; const d=b.dataset;
 if(d.say){say(d.say);return}
 if(d.les){lesson=LESSONS.find(l=>l.id===d.les);T=null;render();return}
 if(d.lback){lesson=null;T=null;render();return}
 if(d.lreview){T=null;render();return}
 if(d.ltest){T={i:0,right:0,order:shuffle(lesson.w)};testOpts();render();return}
 if(d.lpick){T.picked=+d.lpick;if(T.opts[T.picked]===T.order[T.i])T.right++;render(true);return}
 if(d.lnext){T.i++;if(T.i<T.order.length){testOpts();render()}else{donej[lesson.id]=Math.max(donej[lesson.id]||0,T.right);store.set('done',JSON.stringify(donej));render()}return}
 if(d.go){go(d.go);return}
 if(d.speaker){speaker=d.speaker;store.set('speaker',speaker);render(true);return}
 if(d.soundtab){soundTab=d.soundtab;render(true);return}
 if(d.phrasetab){phraseTab=d.phrasetab;render(true);return}
 if(d.lfilter){letterFilter=d.lfilter;render(true);return}
 if(d.letter){letterSel=d.letter;render(true);document.getElementById('ldetail').scrollIntoView({block:'center'});return}
 if(d.drill){drillSet=d.drill;newQ();render(true);return}
 if(d.opt){q.picked=+d.opt;score[1]++;if(q.opts[q.picked]===q.ans)score[0]++;render(true);return}
 if(d.next){newQ();render(true);if(voiceState!=='none'&&voiceState!=='nothai')say(q.ans[0]);return}
});
function setRate(r){rate=r;store.set('rate',r);document.getElementById('spd-n').setAttribute('aria-pressed',r==='0.9');document.getElementById('spd-s').setAttribute('aria-pressed',r==='0.55')}
document.getElementById('spd-n').onclick=()=>setRate('0.9');
document.getElementById('spd-s').onclick=()=>setRate('0.55');
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(V[h]&&h!==view){view=h;render()}});
if('speechSynthesis' in window)speechSynthesis.addEventListener?.('voiceschanged',()=>{loadVoice();const n=document.getElementById('voice-note');if(n)n.textContent=voiceNote()});
setRate(rate); view=current(); render();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}</script>
</body>
</html>
